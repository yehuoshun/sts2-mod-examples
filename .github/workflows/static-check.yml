name: Static API Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run API whitelist check
        run: |
          python3 scripts/check-api.py

      - name: Verify localization JSON
        run: |
          python3 - <<'EOF'
          import json, glob
          for f in glob.glob('Sts2ModExamples/localization/*/*.json'):
              json.load(open(f, encoding='utf-8'))
          print("✅ 全部本地化 JSON 合法")
          EOF
